<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>MediaInfo Ringkas</title>
  <style>
    body { font-family: Arial, sans-serif; background:#111; color:#eee; padding:20px }
    textarea { width:100%; height:260px; background:#1e1e1e; color:#eee; border:1px solid #444; padding:10px }
    button { margin:15px 0; padding:10px 18px; font-size:16px; cursor:pointer }
    pre { background:#1b1b1b; padding:15px; white-space:pre-wrap; border:1px solid #333 }
    h2 { margin-top:30px }
  </style>
</head>
<body>

<h1>MediaInfo Ringkas</h1>
<p>Tempel hasil MediaInfo lengkap di bawah, lalu klik <b>Ringkaskan</b>.</p>

<textarea id="input"></textarea>
<button onclick="summarize()">Ringkaskan</button>

<h2>Hasil</h2>
<pre id="output"></pre>

<script>
function getValue(text, key) {
  const regex = new RegExp(key + "\\s*:\\s*(.+)");
  const match = text.match(regex);
  return match ? match[1].trim() : "-";
}

function summarize() {
  const t = document.getElementById('input').value;

  const result = [];

  // Video
  result.push("Video");
  result.push("Complete name               : " + getValue(t, "Complete name"));
  result.push("Duration                    : " + getValue(t, "Duration"));
  result.push("Bit rate                    : " + getValue(t, "Bit rate\\s*:\\s*[0-9]"));
  result.push("Width                       : " + getValue(t, "Width"));
  result.push("Height                      : " + getValue(t, "Height"));
  result.push("");

  // Audio
  result.push("Audio");
  result.push("Format                      : " + getValue(t, "Format\\s*:\\s*E-AC-3"));
  result.push("Duration                    : " + getValue(t, "Duration"));
  result.push("Bit rate                    : " + getValue(t, "640 kb/s"));
  result.push("Channel(s)                  : " + getValue(t, "Channel\\(s\\)"));
  result.push("Sampling rate               : " + getValue(t, "Sampling rate"));
  result.push("");

  // Text / Subtitle
  result.push("Text");
  const titleRegex = /Title\s*:\s*(.+)/g;
  const langRegex = /Language\s*:\s*(.+)/g;
  let titles = [...t.matchAll(titleRegex)];
  let langs = [...t.matchAll(langRegex)];

  titles.forEach((m, i) => {
    result.push("Title                       : " + m[1]);
    if (langs[i]) result.push("Language                    : " + langs[i][1]);
  });

  result.push("");

  // Menu
  result.push("Menu");
  const menuRegex = /^\d{2}:\d{2}:\d{2}\.\d{3}.+$/gm;
  const menus = t.match(menuRegex);
  if (menus) menus.forEach(m => result.push(m));

  document.getElementById('output').textContent = result.join("\n");
}
</script>

</body>
</html>
