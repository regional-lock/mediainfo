<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>MediaInfo Ringkas</title>
  <style>
    body { font-family: Arial, sans-serif; background:#111; color:#eee; padding:20px }
    textarea { width:100%; height:260px; background:#1e1e1e; color:#eee; border:1px solid #444; padding:10px }
    button { margin:15px 0; padding:10px 18px; font-size:16px; cursor:pointer }
    pre { background:#1b1b1b; padding:15px; white-space:pre-wrap; border:1px solid #333 }
    h2 { margin-top:30px }
  </style>
</head>
<body>

<h1>MediaInfo Ringkas</h1>
<p>Tempel hasil MediaInfo lengkap di bawah, lalu klik <b>Ringkaskan</b>.</p>

<textarea id="input"></textarea>
<button onclick="summarize()">Ringkaskan</button>

<h2>Hasil</h2>
<pre id="output"></pre>

<script>
function find(section, key) {
  const r = new RegExp(section + "[\\s\\S]*?" + key + "\\s*:\\s*(.+)");
  const m = document.getElementById('input').value.match(r);
  return m ? m[1].trim() : "-";
}

function filenameOnly(path) {
  if (!path) return "-";
  return path.split(/\\|\//).pop();
}

function summarize() {
  const t = document.getElementById('input').value;
  const out = [];

  // VIDEO
  out.push("Video");
  out.push("Complete name               : " + filenameOnly(find("General", "Complete name")));
  out.push("Duration                    : " + find("Video", "Duration"));
  out.push("Bit rate                    : " + find("Video", "Bit rate"));
  out.push("Width                       : " + find("Video", "Width"));
  out.push("Height                      : " + find("Video", "Height"));
  out.push("");

  // AUDIO
  out.push("Audio");
  out.push("Format                      : " + find("Audio", "Format"));
  out.push("Duration                    : " + find("Audio", "Duration"));
  out.push("Bit rate                    : " + find("Audio", "Bit rate"));
  out.push("Channel(s)                  : " + find("Audio", "Channel\\(s\\)"));
  out.push("Sampling rate               : " + find("Audio", "Sampling rate"));
  out.push("");

  // TEXT / SUBTITLE
  out.push("Text");
  const textBlocks = t.split(/Text #\\d+/).slice(1);
  textBlocks.forEach(b => {
    const title = b.match(/Title\\s*:\\s*(.+)/);
    const lang = b.match(/Language\\s*:\\s*(.+)/);
    if (title && lang) {
      out.push("Title                       : " + title[1]);
      out.push("Language                    : " + lang[1]);
    }
  });
  out.push("");

  // MENU
  out.push("Menu");
  const menus = t.match(/^\\d{2}:\\d{2}:\\d{2}\\.\\d{3}.+$/gm);
  if (menus) menus.forEach(m => out.push(m));

  document.getElementById('output').textContent = out.join("\n");
}
</script>

</body>
</html>
